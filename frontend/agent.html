<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insura AI Agent</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
text-align:center;
margin:20px;
}

.container{
background:white;
width:900px;
margin:auto;
padding:20px;
border-radius:10px;
}

input{
width:500px;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:#0056b3;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

#response{
margin-top:20px;
padding:15px;
background:#f0f0f0;
border-radius:10px;
white-space:pre-wrap;
text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h1>Insura AI Agent</h1>

<img
src="avatar.png"
alt="Avatar"
width="250">

<br><br>

<button onclick="startListening()">
🎤 Speak
</button>

<p id="userText"></p>

<input
type="text"
id="question"
placeholder="Ask anything about insurance...">

<button onclick="askAgent()">
Send
</button>

<div id="response">
Welcome to Insura. Ask me about policies, recommendations or enrollments.
</div>

</div>

<script>

function startListening(){

const recognition =
new webkitSpeechRecognition();

recognition.start();

recognition.onresult =
function(event){

let text =
event.results[0][0].transcript;

document.getElementById(
"userText"
).innerHTML =
"You said: " + text;

document.getElementById(
"question"
).value =
text;

askAgent();

};

}

async function askAgent(){

let question =
document.getElementById(
"question"
).value;

let response =
await fetch(
"http://127.0.0.1:5000/chat",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
question:question
})
}
);

let data =
await response.json();

document.getElementById(
"response"
).innerHTML =
data.answer;

speak(data.answer);

}

function speak(text){

let speech =
new SpeechSynthesisUtterance(
text
);

speechSynthesis.speak(
speech
);

}

</script>

</body>
</html>
