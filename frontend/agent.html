
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insura AI Agent</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:0;
}

.container{
max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#0056b3;
}

.avatar{
text-align:center;
}

.avatar img{
width:220px;
border-radius:10px;
}

.chat-box{
height:450px;
overflow-y:auto;
border:1px solid #ddd;
padding:15px;
border-radius:10px;
background:#fafafa;
margin-top:20px;
}

.user{
background:#d9ecff;
padding:10px;
border-radius:10px;
margin:10px;
text-align:right;
}

.bot{
background:#eeeeee;
padding:10px;
border-radius:10px;
margin:10px;
text-align:left;
}

.input-area{
display:flex;
gap:10px;
margin-top:15px;
}

input{
flex:1;
padding:12px;
font-size:16px;
}

button{
padding:12px 20px;
background:#0056b3;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#003d82;
}

.status{
text-align:center;
margin-top:10px;
font-weight:bold;
color:green;
}

</style>

</head>

<body>

<div class="container">

<h1>Insura AI Agent</h1>

<div class="avatar">

<img
src="avatar.png"
alt="AI Avatar">

</div>

<div
id="chatBox"
class="chat-box">

<div class="bot">

Hello 👋

I am Insura.

I can:

• Explain LIC Policies

• Recommend Policies

• Compare Policies

• Enroll Customers

Speak or type your question.

</div>

</div>

<div class="input-area">

<input
type="text"
id="question"
placeholder="Ask anything about insurance...">

<button onclick="askAgent()">
Send
</button>

<button onclick="startListening()">
🎤 Start
</button>

<button onclick="stopListening()">
🛑 Stop
</button>

</div>

<div
id="status"
class="status">

Voice Assistant Off

</div>

</div>

<script>

let recognition;
let listening = false;

function addMessage(
message,
type
){

let chatBox =
document.getElementById(
"chatBox"
);

let div =
document.createElement(
"div"
);

div.className = type;

div.innerText = message;

chatBox.appendChild(
div
);

chatBox.scrollTop =
chatBox.scrollHeight;

}

async function askAgent(){

let question =
document.getElementById(
"question"
).value;

if(
question.trim()===""
){
return;
}

addMessage(
question,
"user"
);

document.getElementById(
"question"
).value = "";

try{

let response =
await fetch(
"http://127.0.0.1:5000/chat",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
question:question
})
}
);

let data =
await response.json();

addMessage(
data.answer,
"bot"
);

speak(
data.answer
);

}
catch(error){

addMessage(
"Unable to connect to server.",
"bot"
);

}

}

function startListening(){

if(listening){
return;
}

recognition =
new webkitSpeechRecognition();

recognition.continuous = true;

recognition.interimResults = false;

recognition.lang = "en-US";

listening = true;

document.getElementById(
"status"
).innerHTML =
"🎤 Listening...";

recognition.start();

recognition.onresult =
function(event){

let text =
event.results[
event.results.length-1
][0].transcript;

document.getElementById(
"question"
).value =
text;

askAgent();

};

recognition.onend =
function(){

if(listening){

recognition.start();

}

};

}

function stopListening(){

listening = false;

if(recognition){

recognition.stop();

}

document.getElementById(
"status"
).innerHTML =
"Voice Assistant Off";

}

function speak(text){

if(recognition){

recognition.stop();

}

let speech =
new SpeechSynthesisUtterance(
text
);

speech.rate = 1;

speech.pitch = 1;

speech.lang = "en-US";

speech.onend =
function(){

if(listening){

recognition.start();

}

};

speechSynthesis.speak(
speech
);

}

document
.getElementById(
"question"
)
.addEventListener(
"keypress",
function(event){

if(
event.key==="Enter"
){

askAgent();

}

}
);

</script>

</body>

</html>
